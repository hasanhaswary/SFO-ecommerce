version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: sfo_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: summit_forge_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d summit_forge_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sfo_app
    restart: always
    ports:
      - "5300:5300"
    environment:
      PORT: 5300
      DATABASE_URL: "postgresql://postgres:password123@postgres:5432/summit_forge_db?schema=public"
      JWT_SECRET: "hasan_summit_forge_jwt_super_secret_key_2026"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
